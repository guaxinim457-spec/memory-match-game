<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <title>Little Match — Memory Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
    :root { color-scheme: light; --ink:#202d2a; --muted:#7b8780; --green:#2e6652; --mint:#dcebe2; --paper:#f7f5f0; --line:#e8e6df; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:'DM Sans',sans-serif; }
    button { font:inherit }
    .shell { width:min(100% - 40px, 920px); margin:0 auto; padding:35px 0 42px; }
    header { display:flex; justify-content:space-between; align-items:center; padding-bottom:27px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; font:800 19px 'Manrope',sans-serif; letter-spacing:-.7px; }
    .brand-mark { width:35px;height:35px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:white;font-size:18px;box-shadow:0 4px 10px #2e665233; }
    .tag { color:var(--muted);font-size:12px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700; }
    main { max-width:570px; margin:49px auto 0; }
    .intro { text-align:center; }
    .eyebrow { color:var(--green);font-size:12px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;margin:0 0 11px; }
    h1 { font:800 clamp(34px,6vw,48px)/1.08 'Manrope',sans-serif; letter-spacing:-2px;margin:0; }
    .sub { color:var(--muted);font-size:15px;margin:12px 0 0; }
    .stats { display:flex; justify-content:center; gap:12px; margin:29px 0 21px; }
    .stat { min-width:128px; padding:12px 18px; background:#fff; border:1px solid var(--line); border-radius:14px; text-align:center; }
    .stat-label { color:var(--muted);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;display:block;margin-bottom:3px; }
    .stat strong { font:700 20px 'Manrope',sans-serif; }
    .board { display:grid;grid-template-columns:repeat(4,1fr);gap:12px;perspective:900px; }
    .card { aspect-ratio:1; border:0;background:transparent;padding:0;cursor:pointer;perspective:700px;outline:none; }
    .card-inner { position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.7,.2,1); }
    .card.flipped .card-inner,.card.matched .card-inner { transform:rotateY(180deg); }
    .face { position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;backface-visibility:hidden;transition:box-shadow .2s, transform .2s; }
    .front { background:var(--green);color:#d7e8db;box-shadow:0 4px 0 #214b3b; }
    .front span { font:700 25px 'Manrope',sans-serif;opacity:.8; }
    .card:hover:not(.flipped):not(.matched) .front { transform:translateY(-2px);box-shadow:0 6px 0 #214b3b,0 8px 16px #214b3b22; }
    .back { background:white;border:1px solid var(--line);transform:rotateY(180deg);font-size:clamp(30px,7vw,47px);box-shadow:0 4px 12px #20352c0b; }
    .card.matched .back { background:var(--mint);border-color:#c6ddcf; }
    .card:focus-visible .face { outline:3px solid #e6a85a;outline-offset:3px; }
    .controls { display:flex;justify-content:center;gap:10px;margin-top:22px; }
    .control { border:1px solid var(--line);background:white;color:var(--ink);border-radius:11px;padding:10px 17px;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s,transform .15s; }
    .control:hover { background:#f0eee8;transform:translateY(-1px); }
    .control.primary { background:var(--green);border-color:var(--green);color:white; }
    .control.primary:hover { background:#244f40; }
    .message { height:24px;text-align:center;color:var(--green);font-weight:700;font-size:14px;margin:15px 0 0; }
    footer { text-align:center;color:#9aa29d;font-size:12px;margin-top:28px; }
    @media(max-width:520px) { .shell{width:min(100% - 28px, 420px);padding-top:22px} header{padding-bottom:19px} main{margin-top:37px}.board{gap:9px}.face{border-radius:12px}.stats{gap:8px;margin:24px 0 17px}.stat{min-width:0;flex:1;padding:10px}.tag{font-size:10px} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important} }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span> little match</div>
      <span class="tag">A tiny brain break</span>
    </header>
    <main>
      <section class="intro" aria-labelledby="title">
        <p class="eyebrow">Find the pairs</p>
        <h1 id="title">Memory match</h1>
        <p class="sub">Flip the cards and see what you can remember.</p>
      </section>
      <section class="stats" aria-label="Game stats">
        <div class="stat"><span class="stat-label">Moves</span><strong id="moves">0</strong></div>
        <div class="stat"><span class="stat-label">Matches</span><strong id="matches">0 / 8</strong></div>
        <div class="stat"><span class="stat-label">Time</span><strong id="time">00:00</strong></div>
      </section>
      <section id="board" class="board" aria-label="Memory game cards"></section>
      <p id="message" class="message" aria-live="polite"></p>
      <div class="controls">
        <button id="restart" class="control primary" type="button">↻ &nbsp;New game</button>
        <button id="sound" class="control" type="button" aria-pressed="false">♫ &nbsp;Sound off</button>
      </div>
      <footer>Take your time. Your brain is doing lovely things.</footer>
    </main>
  </div>
  <script>
    (() => {
      const symbols = ['🍋','🍓','🌼','🍄','🐝','🍒','🦋','🌙'];
      const board = document.querySelector('#board');
      const movesEl = document.querySelector('#moves');
      const matchesEl = document.querySelector('#matches');
      const timeEl = document.querySelector('#time');
      const messageEl = document.querySelector('#message');
      const soundButton = document.querySelector('#sound');
      let first = null, locked = false, moves = 0, matches = 0, seconds = 0, timer = null, started = false, soundOn = false, audio;
      const shuffle = (items) => { for (let i=items.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [items[i],items[j]]=[items[j],items[i]]; } return items; };
      const playTone = (frequency=520, duration=.08) => {
        if (!soundOn) return;
        try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); const osc=audio.createOscillator(), gain=audio.createGain(); osc.frequency.value=frequency; osc.type='sine'; gain.gain.setValueAtTime(.08,audio.currentTime); gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration); osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration); } catch (_) {}
      };
      const formatTime = n => `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
      function startTimer() { if (started) return; started=true; timer=setInterval(()=>{ seconds++;timeEl.textContent=formatTime(seconds); },1000); }
      function choose(card) {
        if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
        startTimer(); card.classList.add('flipped'); card.setAttribute('aria-label',`Revealed ${card.dataset.symbol}`); playTone(520);
        if (!first) { first=card;return; }
        moves++;movesEl.textContent=moves; const second=card; locked=true;
        if (first.dataset.symbol===second.dataset.symbol) {
          first.classList.add('matched');second.classList.add('matched'); first.setAttribute('aria-label',`Matched ${first.dataset.symbol}`);second.setAttribute('aria-label',`Matched ${second.dataset.symbol}`);matches++;matchesEl.textContent=`${matches} / 8`;first=null;locked=false;playTone(760,.14);
          if (matches===8) { clearInterval(timer); messageEl.textContent=`Lovely! You found them all in ${moves} moves.`;playTone(900,.24); }
        } else {
          const a=first;first=null;setTimeout(()=>{ for (const c of [a,second]) { c.classList.remove('flipped');c.setAttribute('aria-label','Face-down card'); }locked=false; },850);
        }
      }
      function newGame() {
        clearInterval(timer);first=null;locked=false;moves=0;matches=0;seconds=0;started=false;
        movesEl.textContent='0';matchesEl.textContent='0 / 8';timeEl.textContent='00:00';messageEl.textContent='';
        board.replaceChildren(...shuffle([...symbols,...symbols]).map((symbol,index)=>{
          const card=document.createElement('button');card.type='button';card.className='card';card.dataset.symbol=symbol;card.setAttribute('aria-label','Face-down card');card.setAttribute('aria-pressed','false');
          card.innerHTML=`<span class="card-inner"><span class="face front" aria-hidden="true"><span>✳</span></span><span class="face back" aria-hidden="true">${symbol}</span></span>`;
          card.addEventListener('click',()=>{choose(card);card.setAttribute('aria-pressed',String(card.classList.contains('flipped')||card.classList.contains('matched')));});
          return card;
        }));
      }
      document.querySelector('#restart').addEventListener('click',newGame);
      soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.setAttribute('aria-pressed',String(soundOn));soundButton.innerHTML=soundOn?'♫ &nbsp;Sound on':'♫ &nbsp;Sound off';if(soundOn)playTone(620);});
      newGame();
    })();
  </script>
</body>
</html>
